name: Release

# Full pipeline: lint → test → semver → release.
# Runs only when commits land on main (direct push or merged PR).
on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Test
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Semver  —  determine next version and push a git tag
  #
  # Uses Conventional Commits to decide bump type:
  #   fix: / fix!:          → patch  (1.1.0 → 1.1.1)
  #   feat: / feat!:        → minor  (1.1.0 → 1.2.0)
  #   BREAKING CHANGE:      → major  (1.1.0 → 2.0.0)
  #   any other commit      → patch  (default_bump fallback)
  # ─────────────────────────────────────────────────────────────────────────────
  semver:
    name: Semver
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag:     ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Release  —  build cross-platform binaries and publish a GitHub release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: semver
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.semver.outputs.new_tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
