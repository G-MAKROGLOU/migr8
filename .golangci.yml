version: "2"

linters:
  # Start from the default set (standard) and add a few extras.
  # Defaults: errcheck, gosimple, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell      # catches typos in comments and strings
    - unconvert     # removes unnecessary type conversions
    - whitespace    # detects leading/trailing blank lines in blocks
    - nilerr        # finds code that returns nil when err is not nil
    - bodyclose     # ensures HTTP response bodies are closed
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - errcheck

run:
  timeout: 5m
